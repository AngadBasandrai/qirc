[package]
name = "qirc-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly build of qirc for the browser playground"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
qirc = { path = ".." }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
