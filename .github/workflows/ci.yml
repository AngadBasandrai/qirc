name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path python/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path python/Cargo.toml -- -D warnings

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path web/Cargo.toml
      - run: cargo clippy --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml -- -D warnings
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./python pytest
      - run: python -m pytest -q python/tests

  qiskit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "./python[qiskit]" pytest
      - run: python -m pytest -q python/tests/test_qirc.py -k qiskit_plugin

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked
      - run: cargo test --manifest-path target/package/qirc-compiler-*/Cargo.toml

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo check --all-targets
      - run: cargo check --all-targets --manifest-path python/Cargo.toml
      - run: cargo check --target wasm32-unknown-unknown --manifest-path web/Cargo.toml

  emitted-qir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: emitted QIR is valid LLVM IR
        run: |
          for file in tests/corpus/base_profile_bell.ll tests/corpus/adaptive_teleport.ll \
                      tests/corpus/pyqir_simple.ll tests/corpus/pyqir_real.ll \
                      tests/corpus/unrestricted_dynamic.ll tests/corpus/qsharp_*.ll \
                      examples/small.ll; do
            for level in 0 1 2 3; do
              ./target/release/qirc "$file" --emit qir -O$level -o out.ll
              clang -x ir -S -emit-llvm -o /dev/null out.ll
            done
            ./target/release/qirc "$file" --emit qir -O3 --gates rx,ry,cy -o out.ll
            clang -x ir -S -emit-llvm -o /dev/null out.ll
          done
      - name: compiled programs behave like the originals
        run: bash scripts/sweep.sh
