name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path web/Cargo.toml
      - run: cargo clippy --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml -- -D warnings
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets

  emitted-qir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: emitted QIR is valid LLVM IR
        run: |
          for file in tests/corpus/base_profile_bell.ll tests/corpus/adaptive_teleport.ll \
                      tests/corpus/pyqir_simple.ll tests/corpus/pyqir_real.ll \
                      tests/corpus/unrestricted_dynamic.ll tests/corpus/qsharp_*.ll \
                      examples/small.ll; do
            for level in 0 1 2 3; do
              ./target/release/qirc "$file" --emit qir -O$level -o out.ll
              clang -x ir -S -emit-llvm -o /dev/null out.ll
            done
            ./target/release/qirc "$file" --emit qir -O3 --gates rx,ry,cy -o out.ll
            clang -x ir -S -emit-llvm -o /dev/null out.ll
          done
      - name: compiled programs behave like the originals
        run: |
          for file in tests/corpus/*.ll; do
            case "$file" in *syntax_stress*) continue ;; esac
            for options in "-O3" "-O3 --gates rz-sx-cx --resynth 4" "-O2 --gates rz-ry-cz" "-O3 --gates rz-sx-cx --cost cx"; do
              ./target/release/qirc diff "$file" $options
            done
          done
