[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "qirc"
version = "0.1.1"
description = "Compile, optimise, route and simulate QIR from Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Angad Basandrai" }]
keywords = ["quantum", "qir", "compiler", "llvm", "simulator"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://angadbasandrai.github.io/qirc/"
Repository = "https://github.com/AngadBasandrai/qirc"

[tool.maturin]
module-name = "qirc"
