[package]
name = "qirc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Compiler and state vector simulator for QIR, the Quantum Intermediate Representation"
license = "MIT"
repository = "https://github.com/AngadBasandrai/rust-qir"
readme = "README.md"
keywords = ["quantum", "qir", "compiler", "llvm", "simulator"]
categories = ["compilers", "science", "simulation"]

[dependencies]
num-complex = "0.4"

[profile.release]
lto = true
codegen-units = 1
